name: Compilar Admin POS

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      windows_target:
        description: "Qué generar en Windows"
        required: true
        default: "instalador"
        type: choice
        options:
          - instalador
          - portable
          - ambos

jobs:
  android:
    name: APK para Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Poner el ícono de Admin POS
        run: |
          find android/app/src/main/res -name 'ic_launcher*.webp' -delete
          cp -r resources/android/. android/app/src/main/res/
      - name: Permitir conexión por WiFi local (http)
        run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Admin-POS-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Programa para Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar Windows
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.windows_target || 'instalador' }}"
          echo "Objetivo: $TARGET"
          if [ "$TARGET" = "portable" ]; then
            npx electron-builder --win portable --publish never
          elif [ "$TARGET" = "ambos" ]; then
            npx electron-builder --win nsis portable --publish never
          else
            npx electron-builder --win nsis --publish never
          fi
      - name: Listar salidas
        shell: bash
        run: ls -la dist || dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: Admin-POS-windows
          path: |
            dist/Admin-POS-Setup-*.exe
            dist/Admin-POS-Portable-*.exe
          if-no-files-found: error
